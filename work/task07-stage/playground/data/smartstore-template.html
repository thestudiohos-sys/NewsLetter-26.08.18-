<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #e9e7e0;
        color: #181914;
        font-family: Arial, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
        line-height: 1.65;
      }

      .page {
        width: 100%;
        background: #e9e7e0;
      }

      .container {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        background: #f8f6ef;
      }

      .topline {
        padding: 14px 36px;
        background: #181914;
        color: #f8f6ef;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-align: right;
      }

      .hero {
        overflow: hidden;
        background: #d9ff45;
      }

      .hero-copy {
        padding: 44px 16px 42px 40px;
        vertical-align: middle;
      }

      .hero-visual {
        padding: 26px 28px 0 0;
        vertical-align: bottom;
        text-align: right;
      }

      .hero-eyebrow,
      .section-kicker,
      .product-label,
      .recommendation-label {
        margin: 0 0 12px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.2em;
      }

      .hero-title {
        margin: 0;
        font-family:
          Arial Black,
          Arial,
          sans-serif;
        font-size: 58px;
        font-weight: 900;
        letter-spacing: -0.07em;
        line-height: 0.82;
      }

      .hero-title span {
        display: inline-block;
        margin-top: 12px;
        padding: 2px 10px 7px;
        background: #181914;
        color: #f8f6ef;
      }

      .hero-subtitle {
        margin: 28px 0 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.5;
      }

      .hero-store {
        margin: 18px 0 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .hero-image {
        display: block;
        width: 100%;
        max-width: 270px;
        height: auto;
        margin: 0 0 0 auto;
      }

      .hero-image-fallback {
        box-sizing: border-box;
        min-height: 330px;
        padding: 210px 22px 20px;
        border: 1px solid #181914;
        color: #181914;
        font-family:
          Arial Black,
          Arial,
          sans-serif;
        font-size: 22px;
        line-height: 1;
        text-align: left;
      }

      .store-story,
      .editor-note,
      .products-heading,
      .bottom-cta {
        padding: 54px 62px;
      }

      .store-story {
        background: #181914;
        color: #f8f6ef;
      }

      .store-story .section-kicker {
        color: #d9ff45;
      }

      .store-story-copy {
        margin: 0;
        font-family: Georgia, "Noto Serif KR", serif;
        font-size: 21px;
        line-height: 1.7;
      }

      .editor-note {
        background: #f8f6ef;
        border-bottom: 1px solid #181914;
      }

      .editor-note h2 {
        margin: 0 0 18px;
        font-family: Georgia, "Noto Serif KR", serif;
        font-size: 30px;
        line-height: 1.3;
      }

      .editor-note p:last-child {
        margin: 0;
        color: #55564f;
        font-size: 15px;
      }

      .products-heading {
        padding-bottom: 38px;
        background: #f8f6ef;
      }

      .products-heading h2,
      .bottom-cta h2 {
        margin: 0;
        font-family:
          Arial Black,
          Arial,
          sans-serif;
        font-size: 46px;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .products-heading p:last-child {
        margin: 14px 0 0;
        color: #66675f;
        font-size: 14px;
      }

      .product-section {
        border-top: 1px solid #181914;
      }

      .product-section:nth-child(even) {
        background: #e6e0ff;
      }

      .product-layout {
        width: 100%;
      }

      .product-column {
        box-sizing: border-box;
        vertical-align: middle;
      }

      .product-media {
        padding: 34px 22px 34px 34px;
      }

      .product-details {
        padding: 42px 36px;
      }

      .product-image-stage {
        position: relative;
      }

      .product-image-link,
      .secondary-image-link {
        display: block;
      }

      .product-image,
      .secondary-image {
        display: block;
        width: 100%;
        height: auto;
        border: 0;
      }

      .product-image {
        max-width: 300px;
        margin: 0 auto;
      }

      .secondary-image {
        max-width: 124px;
        margin: -44px 0 0 auto;
        border: 6px solid #f8f6ef;
      }

      .product-image-fallback {
        box-sizing: border-box;
        min-height: 290px;
        padding: 190px 24px 24px;
        border: 1px solid #181914;
        background: #efede5;
        color: #77786f;
        font-family:
          Arial Black,
          Arial,
          sans-serif;
        font-size: 22px;
        line-height: 1;
      }

      .product-number {
        margin: 0 0 6px;
        font-family:
          Arial Black,
          Arial,
          sans-serif;
        font-size: 58px;
        font-weight: 900;
        letter-spacing: -0.08em;
        line-height: 0.9;
      }

      .product-label {
        color: #ff5b35;
      }

      .product-name {
        margin: 0 0 16px;
        font-family: Georgia, "Noto Serif KR", serif;
        font-size: 23px;
        line-height: 1.35;
      }

      .product-price {
        margin: 0 0 22px;
        font-size: 19px;
        font-weight: 800;
      }

      .product-features {
        margin: 0 0 24px;
        padding: 0;
        list-style: none;
      }

      .product-features li {
        margin: 0;
        padding: 8px 0;
        border-bottom: 1px solid rgba(24, 25, 20, 0.18);
        font-size: 13px;
      }

      .recommendation-label {
        margin-bottom: 8px;
      }

      .recommendation-reason {
        margin: 0 0 24px;
        color: #4f504a;
        font-size: 13px;
        line-height: 1.7;
      }

      .view-item,
      .store-button {
        display: inline-block;
        padding: 13px 18px;
        background: #181914;
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-decoration: none;
      }

      .bottom-cta {
        background: #ff6847;
        text-align: center;
      }

      .bottom-copy {
        margin: 24px 0 12px;
        font-family: Georgia, "Noto Serif KR", serif;
        font-size: 21px;
      }

      .editorial-cta {
        margin: 0 0 26px;
        font-size: 13px;
      }

      .footer {
        padding: 24px 36px;
        background: #181914;
        color: #a9aaa3;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-align: center;
      }

      @media only screen and (max-width: 600px) {
        .container {
          width: 100% !important;
        }

        .topline {
          padding: 12px 20px !important;
        }

        .hero-copy,
        .hero-visual,
        .product-column {
          display: block !important;
          width: 100% !important;
        }

        .hero-copy {
          padding: 36px 24px 20px !important;
        }

        .hero-visual {
          padding: 0 24px !important;
          text-align: center !important;
        }

        .hero-title {
          font-size: 49px !important;
        }

        .hero-image {
          max-width: 250px !important;
          margin: 0 auto !important;
        }

        .hero-image-fallback {
          min-height: 210px !important;
          padding-top: 120px !important;
        }

        .store-story,
        .editor-note,
        .products-heading,
        .bottom-cta {
          padding: 42px 24px !important;
        }

        .store-story-copy {
          font-size: 18px !important;
        }

        .desktop-break {
          display: none !important;
        }

        .products-heading h2,
        .bottom-cta h2 {
          font-size: 38px !important;
        }

        .product-media {
          padding: 28px 24px 12px !important;
        }

        .product-details {
          padding: 30px 24px 42px !important;
        }

        .product-number {
          font-size: 50px !important;
        }

        .product-name {
          font-size: 21px !important;
        }

        .product-image,
        .product-image-fallback {
          max-width: 320px !important;
          margin-right: auto !important;
          margin-left: auto !important;
        }

        .secondary-image {
          max-width: 106px !important;
          margin-right: 4px !important;
        }
      }
    </style>
  </head>
  <body>
    <table
      class="page"
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center">
          <table
            class="container"
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
          >
            <tr>
              <td class="topline">MY ALL KOREA · WEEKLY PRODUCT EDIT</td>
            </tr>
            <tr>
              <td>{{content}}</td>
            </tr>
            <tr>
              <td class="footer">MY ALL KOREA · PRODUCT CURATION NEWSLETTER</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
