<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f3f4f4;
        color: #263238;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        line-height: 1.7;
      }

      .page {
        width: 100%;
        background-color: #f3f4f4;
      }

      .container {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        background-color: #ffffff;
      }

      .header {
        padding: 30px 40px 24px;
        border-bottom: 1px solid #dde2e3;
      }

      .brand {
        margin: 0;
        color: #41565d;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .content {
        padding: 32px 40px 38px;
      }

      h1 {
        margin: 0 0 26px;
        color: #1f2d32;
        font-size: 30px;
        line-height: 1.35;
        letter-spacing: -0.02em;
      }

      h2,
      h3 {
        margin: 32px 0 14px;
        padding-top: 28px;
        border-top: 1px solid #e3e7e8;
        color: #263b42;
        font-size: 21px;
        line-height: 1.45;
      }

      p {
        margin: 0 0 18px;
      }

      ul,
      ol {
        margin: 8px 0 20px;
        padding-left: 24px;
      }

      li {
        margin-bottom: 7px;
      }

      a {
        color: #245d73;
        font-weight: 600;
        overflow-wrap: anywhere;
        text-decoration: underline;
      }

      hr {
        margin: 30px 0;
        border: 0;
        border-top: 1px solid #dfe4e5;
      }

      .footer {
        padding: 22px 40px 28px;
        border-top: 1px solid #dde2e3;
        color: #68787d;
        font-size: 13px;
        text-align: center;
      }

      @media only screen and (max-width: 600px) {
        .header,
        .content,
        .footer {
          padding-left: 22px !important;
          padding-right: 22px !important;
        }

        h1 {
          font-size: 25px !important;
        }

        h2,
        h3 {
          font-size: 19px !important;
        }
      }
    </style>
  </head>
  <body>
    <table
      class="page"
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center">
          <table
            class="container"
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
          >
            <tr>
              <td class="header">
                <p class="brand">House of Sea</p>
              </td>
            </tr>
            <tr>
              <td class="content">
                <h1>{{title}}</h1>
                {{content}}
              </td>
            </tr>
            <tr>
              <td class="footer">House of Sea · Product Curation Newsletter</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
